version: '3'
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile-db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      deno-react-gpt-bot:

  deno:
    build:
      context: .
      dockerfile: Dockerfile-deno
    ports:
      - '1993:1993'
    depends_on:
      - db
    networks:
      deno-react-gpt-bot:

  react:
    build:
      context: .
      dockerfile: Dockerfile-react
    volumes:
      - ./ui:/var/ui
    ports:
      - '5190:5190'
    depends_on:
      - deno
    networks:
      deno-react-gpt-bot:

networks:
  deno-react-gpt-bot:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24

volumes:
  db_data: